name: HyperLock CI

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/release.jks"
            if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 解码后的证书为空，请检查 Secret 内容。"
              exit 1
            fi
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已从 RELEASE_KEYSTORE_BASE64 还原签名证书。"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，构建将使用调试签名。"
          fi

      - name: Build with Gradle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p ci-assets
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp app/build/outputs/apk/release/*.apk "ci-assets/HyperLock-CI-${SHORT_SHA}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: HyperLock-CI-apk
          path: ci-assets/*.apk
