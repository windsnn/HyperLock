name: HyperLock Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/release.jks"
            if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 解码后的证书为空，请检查 Secret 内容。"
              exit 1
            fi
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已从 RELEASE_KEYSTORE_BASE64 还原签名证书。"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，release 构建将使用调试签名。"
          fi

      - name: Build with Gradle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          HYPERLOCK_TAG: ${{ github.ref_name }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk "release-assets/HyperLock-${GITHUB_REF_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: HyperLock-${{ github.ref_name }}-apk
          path: release-assets/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *Beta*|*beta*|*RC*|*rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.apk \
            LICENSE NOTICE THIRD-PARTY.md \
            --title "HyperLock $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
          || gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.apk \
            LICENSE NOTICE THIRD-PARTY.md \
            --clobber
